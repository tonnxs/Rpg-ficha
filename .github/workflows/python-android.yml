name: Build Mesa RPG Python APK
on:
  workflow_dispatch:
  push:
    branches: [python-kivy]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Mesa-RPG-Python-APK
          path: bin/*.apk
          retention-days: 30
