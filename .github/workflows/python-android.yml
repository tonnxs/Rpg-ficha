name: Build Mesa RPG Python APK
on:
  workflow_dispatch:
  push:
    branches: [python-kivy]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake m4 libtool libtool-bin gettext autopoint pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Verify autotools macros
        run: |
          test -f /usr/share/aclocal/libtool.m4
          command -v libtoolize
          command -v autoreconf
          aclocal --print-ac-dir
      - name: Build APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-RPG-Python-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
